version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
      POSTGRES_DB: flight_reservation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://flight:flight@db:5432/flight_reservation
      JWT_SECRET: change-me-in-production
      JWT_REFRESH_SECRET: change-me-in-production
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - db

volumes:
  pgdata:
